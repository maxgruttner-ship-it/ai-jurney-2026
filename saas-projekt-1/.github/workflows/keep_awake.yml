name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Git Git-User konfigurieren
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"

      - name: Leeren Commit erstellen und pushen
        run: |
          git commit --allow-empty -m "Keep awake - Automated ping"
          git push